spring:
  application:
    name: core-api
  flyway:
    enabled: false
    validate-on-migrate: true
    ignore-migration-patterns: ''
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: none

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: lax

management:
  endpoint:
    health:
      probes:
        enabled: true

rag:
  session:
    enabled: true
    absolute-timeout: 8h
  retrieval:
    vector:
      enabled: false
      dimension: 1536
