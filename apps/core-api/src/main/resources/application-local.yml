spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
  datasource:
    url: ${RAG_DB_URL:jdbc:postgresql://127.0.0.1:5432/rag_local}
    username: ${RAG_DB_RUNTIME_USER}
    password: ${RAG_DB_RUNTIME_PASSWORD}
    hikari:
      initialization-fail-timeout: 0
  flyway:
    enabled: true
    url: ${RAG_DB_URL:jdbc:postgresql://127.0.0.1:5432/rag_local}
    user: ${RAG_DB_MIGRATION_USER}
    password: ${RAG_DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
    validate-on-migrate: true
rag:
  ai:
    enabled: ${RAG_AI_ENABLED:false}
    provider: ${RAG_AI_PROVIDER:}
    config-version: ${RAG_AI_CONFIG_VERSION:}
    endpoint: ${RAG_AI_ENDPOINT:}
    approved-hosts: ${RAG_AI_APPROVED_HOSTS:}
    api-key: ${RAG_AI_API_KEY:}
    embedding-model: ${RAG_AI_EMBEDDING_MODEL:}
    reranker-model: ${RAG_AI_RERANKER_MODEL:}
    chat-model: ${RAG_AI_CHAT_MODEL:}
    connect-timeout: ${RAG_AI_CONNECT_TIMEOUT:PT3S}
    response-timeout: ${RAG_AI_RESPONSE_TIMEOUT:PT15S}
    total-timeout: ${RAG_AI_TOTAL_TIMEOUT:PT30S}
    max-input-tokens: ${RAG_AI_MAX_INPUT_TOKENS:12000}
    max-output-tokens: ${RAG_AI_MAX_OUTPUT_TOKENS:2000}
    max-concurrency: ${RAG_AI_MAX_CONCURRENCY:4}
    daily-deployment-token-limit: ${RAG_AI_DAILY_DEPLOYMENT_TOKEN_LIMIT:1000000}
    allow-insecure-loopback-for-tests: false
  sanitization:
    business-terms: ${RAG_SANITIZATION_BUSINESS_TERMS:}
  qa:
    hmac-key: ${RAG_QA_QUESTION_HMAC_KEY:}
    actor-rate-limit:
      window: ${RAG_QA_ACTOR_RATE_LIMIT_WINDOW:PT1M}
      max-requests: ${RAG_QA_ACTOR_RATE_LIMIT_MAX_REQUESTS:20}
    evaluation:
      fixture:
        enabled: ${RAG_QA_EVALUATION_FIXTURE_ENABLED:false}
    metrics:
      input-cost-per-million-tokens: ${RAG_AI_INPUT_COST_PER_MILLION_TOKENS:0}
      output-cost-per-million-tokens: ${RAG_AI_OUTPUT_COST_PER_MILLION_TOKENS:0}
  workers:
    enabled: ${RAG_WORKERS_ENABLED:true}
  solution:
    proposals:
      recovery:
        enabled: ${RAG_SOLUTION_PROPOSAL_RECOVERY_ENABLED:true}
        poll-delay: ${RAG_SOLUTION_PROPOSAL_RECOVERY_POLL_DELAY:PT30S}
        batch-size: ${RAG_SOLUTION_PROPOSAL_RECOVERY_BATCH_SIZE:100}
    generation:
      recovery:
        enabled: ${RAG_SOLUTION_GENERATION_RECOVERY_ENABLED:true}
        poll-delay: ${RAG_SOLUTION_GENERATION_RECOVERY_POLL_DELAY:PT30S}
        lease-duration: ${RAG_SOLUTION_GENERATION_RECOVERY_LEASE_DURATION:PT2M}
        batch-size: ${RAG_SOLUTION_GENERATION_RECOVERY_BATCH_SIZE:100}
  upload:
    quarantine-directory: ${RAG_UPLOAD_QUARANTINE_DIRECTORY:}
  parser:
    endpoint: ${RAG_PARSER_ENDPOINT:http://127.0.0.1:8010}
    connect-timeout: ${RAG_PARSER_CONNECT_TIMEOUT:PT3S}
  ingestion:
    worker:
      id: ${RAG_INGESTION_WORKER_ID:local-ingestion-worker}
      poll-delay: ${RAG_INGESTION_POLL_DELAY:PT1S}
      lease-duration: ${RAG_INGESTION_LEASE_DURATION:PT10M}
      temp-directory: ${RAG_PARSER_TEMP_DIRECTORY:}
      parser-timeout-seconds: ${RAG_PARSER_TIMEOUT_SECONDS:300}
  identity:
    login-source-hmac-key: ${RAG_LOGIN_SOURCE_HMAC_KEY:local-development-login-source-key}
  bootstrap-admin:
    enabled: ${RAG_BOOTSTRAP_ADMIN_ENABLED:true}
    username: ${RAG_BOOTSTRAP_ADMIN_USERNAME:}
    password: ${RAG_BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${RAG_BOOTSTRAP_ADMIN_DISPLAY_NAME:}
  minio:
    endpoint: ${RAG_MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${RAG_MINIO_ACCESS_KEY}
    secret-key: ${RAG_MINIO_SECRET_KEY}
    bucket: ${RAG_MINIO_BUCKET:rag-documents}
  opensearch:
    enabled: ${RAG_OPENSEARCH_ENABLED:true}
    endpoint: ${RAG_OPENSEARCH_ENDPOINT:http://127.0.0.1:9200}
    username: ${RAG_OPENSEARCH_USERNAME:}
    password: ${RAG_OPENSEARCH_PASSWORD:}
    connect-timeout: ${RAG_OPENSEARCH_CONNECT_TIMEOUT:PT3S}
    response-timeout: ${RAG_OPENSEARCH_RESPONSE_TIMEOUT:PT10S}
    worker:
      id: ${RAG_OPENSEARCH_WORKER_ID:local-projection-worker}
      target-index: ${RAG_OPENSEARCH_TARGET_INDEX:rag-chunks-write}
      poll-delay: ${RAG_OPENSEARCH_POLL_DELAY:PT1S}
      batch-size: ${RAG_OPENSEARCH_WORKER_BATCH_SIZE:20}
      space-page-size: ${RAG_OPENSEARCH_SPACE_PAGE_SIZE:100}
      lease-duration: ${RAG_OPENSEARCH_LEASE_DURATION:PT2M}
      max-attempts: ${RAG_OPENSEARCH_MAX_ATTEMPTS:5}
      initial-retry-delay: ${RAG_OPENSEARCH_INITIAL_RETRY_DELAY:PT5S}
      max-retry-delay: ${RAG_OPENSEARCH_MAX_RETRY_DELAY:PT5M}
    rebuild:
      page-size: ${RAG_OPENSEARCH_REBUILD_PAGE_SIZE:100}
      replay-batch-size: ${RAG_OPENSEARCH_REPLAY_BATCH_SIZE:500}
  retrieval:
    vector:
      enabled: ${RAG_VECTOR_ENABLED:false}
      dimension: ${RAG_VECTOR_DIMENSION:1536}

management:
  endpoint:
    health:
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,minio,opensearchRead,opensearchProjection,embeddingCapability,modelGateway
  endpoints:
    web:
      exposure:
        include: health
