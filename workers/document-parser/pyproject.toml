[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "yunjihai-document-parser"
version = "0.1.0"
description = "云基华海企业级 RAG 无状态文档解析 Worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "jsonschema==4.26.0",
  "python-multipart==0.0.32",
  "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
parsing = [
  "docling==2.130.0",
  "paddleocr==3.7.0",
]

[dependency-groups]
dev = [
  "httpx2==2.13.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/parser_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["parser_worker"]
